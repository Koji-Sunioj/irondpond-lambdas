name: update-ironpond-lambda-functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  FUNCTION_BUCKET: ${{ secrets.FUNCTION_BUCKET }}
  PAT: ${{ secrets.PAT }}

jobs:
  update-lambda-s3:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
      - name: update s3 and lambda
        run: |
          zip ironpond_functions.zip trigger_athena.py
          aws s3api put-object --region us-east-1 --bucket $FUNCTION_BUCKET \
            --key functions/ironpond_functions.zip --body ironpond_functions.zip

  update-cfn: 
    runs-on: "ubuntu-latest"
    needs: update-lambda-s3
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: $PAT
          repository: Koji-Sunioj/ironpond-cfn
          event-type: updated-function-zip